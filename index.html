<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resume Builder — Draft your paper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
 
  <header class="topbar">
    <div class="topbar__mark">
      <span class="topbar__nib">✒</span>
      <span class="topbar__word">Draft</span>
    </div>
    <p class="topbar__tag">Fill the left side. Watch the paper on the right.</p>
    <button id="printBtn" class="btn btn--ink">Save as PDF</button>
  </header>
 
  <main class="workspace">
 
    <!-- ============ LEFT: THE FORM ============ -->
    <section class="deskside" aria-label="Resume details form">
 
      <div class="field-group">
        <p class="field-group__label">01 — Header</p>
        <label class="field">
          <span>Full name</span>
          <input type="text" id="in-name" placeholder="Asha Rao" />
        </label>
        <label class="field">
          <span>Role you're applying for</span>
          <input type="text" id="in-role" placeholder="Frontend Developer" />
        </label>
        <div class="field-row">
          <label class="field">
            <span>Email</span>
            <input type="text" id="in-email" placeholder="asha@email.com" />
          </label>
          <label class="field">
            <span>Phone</span>
            <input type="text" id="in-phone" placeholder="+91 90000 00000" />
          </label>
        </div>
        <label class="field">
          <span>City</span>
          <input type="text" id="in-location" placeholder="Chennai, India" />
        </label>
      </div>
 
      <div class="field-group">
        <p class="field-group__label">02 — Summary</p>
        <label class="field">
          <span>Two or three lines about you</span>
          <textarea id="in-summary" rows="3" placeholder="Final-year CS student who builds clean, fast web apps and enjoys turning messy requirements into working software."></textarea>
        </label>
      </div>
 
      <div class="field-group">
        <div class="field-group__head">
          <p class="field-group__label">03 — Experience</p>
          <button class="btn btn--ghost" id="addExp" type="button">+ Add role</button>
        </div>
        <div id="expList" class="repeat-list"></div>
      </div>
 
      <div class="field-group">
        <div class="field-group__head">
          <p class="field-group__label">04 — Education</p>
          <button class="btn btn--ghost" id="addEdu" type="button">+ Add school</button>
        </div>
        <div id="eduList" class="repeat-list"></div>
      </div>
 
      <div class="field-group">
        <p class="field-group__label">05 — Skills</p>
        <label class="field">
          <span>Comma-separated</span>
          <input type="text" id="in-skills" placeholder="JavaScript, React, Git, SQL, Figma" />
        </label>
      </div>
 
    </section>
 
    <!-- ============ RIGHT: THE PAPER ============ -->
    <section class="deskside deskside--paper" aria-label="Resume preview">
      <div class="paper" id="paper">
        <div class="paper__corner" aria-hidden="true"></div>
 
        <h1 class="paper__name" id="out-name">Your Name</h1>
        <p class="paper__role" id="out-role">Role you're applying for</p>
 
        <p class="paper__contact" id="out-contact">email · phone · city</p>
 
        <div class="paper__section" id="sec-summary">
          <h2>Summary</h2>
          <p id="out-summary" class="paper__summary">Your two-line pitch will appear here as you type.</p>
        </div>
 
        <div class="paper__section" id="sec-exp">
          <h2>Experience</h2>
          <div id="out-exp"></div>
        </div>
 
        <div class="paper__section" id="sec-edu">
          <h2>Education</h2>
          <div id="out-edu"></div>
        </div>
 
        <div class="paper__section" id="sec-skills">
          <h2>Skills</h2>
          <ul class="paper__skills" id="out-skills"></ul>
        </div>
      </div>
    </section>
 
  </main>
 
  <template id="expRowTemplate">
    <div class="repeat-item">
      <button class="repeat-item__remove" type="button" aria-label="Remove this role">×</button>
      <div class="field-row">
        <label class="field"><span>Job title</span><input type="text" class="exp-title" placeholder="Intern, Web Team" /></label>
        <label class="field"><span>Company</span><input type="text" class="exp-company" placeholder="Acme Labs" /></label>
      </div>
      <label class="field"><span>Dates</span><input type="text" class="exp-dates" placeholder="Jun 2025 – Aug 2025" /></label>
      <label class="field"><span>What you did</span><textarea class="exp-desc" rows="2" placeholder="Built and shipped 3 internal dashboards used by 40+ staff."></textarea></label>
    </div>
  </template>
 
  <template id="eduRowTemplate">
    <div class="repeat-item">
      <button class="repeat-item__remove" type="button" aria-label="Remove this school">×</button>
      <div class="field-row">
        <label class="field"><span>Degree</span><input type="text" class="edu-degree" placeholder="B.Tech, Computer Science" /></label>
        <label class="field"><span>School</span><input type="text" class="edu-school" placeholder="Anna University" /></label>
      </div>
      <label class="field"><span>Years</span><input type="text" class="edu-years" placeholder="2022 – 2026" /></label>
    </div>
  </template>
 
  <script src="script.js"></script>
</body>
</html>
